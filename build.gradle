// Tiger I fixtures are opt-in and excluded from shipped mod sources.
sourceSets {
    tigerIntegration {
        java.srcDirs = ['src/tigerIntegration/java', 'src/dieselIntegration/java']
        java.include 'com/hooya/stabilizedturret/content/tiger/**', 'com/hooya/stabilizedturret/client/Tiger*',
                'edn/stratodonut/drivebywire/compat/**', 'com/getitemfromblock/create_tweaked_controllers/controller/**'
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath = output + sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
if (providers.gradleProperty('tigerIntegration').getOrElse('false').toBoolean()) {
    runs.configureEach {
        modSource project.sourceSets.tigerIntegration
        systemProperty 'create_fire_control.tigerAudioChecks', 'true'
        systemProperty 'create_fire_control.tigerResourceChecksOnly',
                providers.gradleProperty('tigerResourceChecksOnly').getOrElse('false')
    }
    ['runServer': 'server/tiger-integration-result.txt', 'runClient': 'client/tiger-audio-client-result.txt'].each { taskName, path ->
        def result = layout.projectDirectory.dir(providers.gradleProperty('runRoot').getOrElse('run')).file(path).asFile
        tasks.matching { it.name == taskName }.configureEach {
            doFirst { result.parentFile.mkdirs(); result.text = 'RUNNING' }
            doLast {
                if (!result.isFile() || result.text.trim() != 'PASS') throw new GradleException('Tiger I fixture failed: ' + (result.isFile() ? result.text : 'missing result'))
            }
        }
    }
