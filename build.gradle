version = mod_version
group = mod_group_id

base {
    archivesName = 'create-fire-control'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content { includeGroup('software.bernie.geckolib') }
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup('maven.modrinth') }
    }
}

// Opt-in server integration checks; these classes never enter the shipped mod JAR.
sourceSets {
    weaponViewIntegration {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath = output + sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    infraredIntegration {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath = output + sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    missileIntegration {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath = output + sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    bombIntegration {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath = output + sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    rocketIntegration {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath = output + sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    dieselIntegration {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath = output + sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    apfsdsIntegration {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath = output + sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    annihilationIntegration {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath = output + sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    gunfireIntegration {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath = output + sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    recoilIntegration {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath = output + sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    ticketIntegration {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath = output + sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    nativeBearing {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    bearingIntegration {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath = output + sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    controllerIntegration {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath = output + sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

runs {
    configureEach {
        systemProperty 'forge.logging.console.level', 'info'
        workingDirectory project.layout.projectDirectory
                .dir(providers.gradleProperty('runRoot').getOrElse('run'))
                .dir(name)
        modSource project.sourceSets.main
    }

    client {
        if (providers.gradleProperty('weaponViewClientChecks').getOrElse('false').toBoolean()) {
            modSource project.sourceSets.weaponViewIntegration
            systemProperty 'create_fire_control.weaponViewClientChecks', 'true'
            argument '--width'
            argument '1280'
            argument '--height'
            argument '720'
        }
        if (providers.gradleProperty('infraredClientChecks').getOrElse('false').toBoolean()) {
            modSource project.sourceSets.infraredIntegration
            systemProperty 'create_fire_control.infraredClientChecks', 'true'
            argument '--width'
            argument '2560'
            argument '--height'
            argument '1440'
        }
        if (providers.gradleProperty('missileClientChecks').getOrElse('false').toBoolean()) {
            modSource project.sourceSets.missileIntegration
            systemProperty 'create_fire_control.missileClientChecks', 'true'
            argument '--width'
            argument '1280'
            argument '--height'
            argument '720'
        }
        if (providers.gradleProperty('bombClientChecks').getOrElse('false').toBoolean()) {
            modSource project.sourceSets.bombIntegration
            systemProperty 'create_fire_control.bombClientChecks', 'true'
        }
        if (providers.gradleProperty('dieselClientChecks').getOrElse('false').toBoolean()) {
            modSource project.sourceSets.dieselIntegration
            systemProperty 'create_fire_control.dieselClientChecks', 'true'
        }
        if (providers.gradleProperty('engineBehaviorClientChecks').getOrElse('false').toBoolean()) {
            modSource project.sourceSets.dieselIntegration
            systemProperty 'create_fire_control.engineBehaviorClientChecks', 'true'
        }
    }
    server {
        argument '--nogui'
        if (providers.gradleProperty('weaponViewServerChecks').getOrElse('false').toBoolean()) {
            modSource project.sourceSets.weaponViewIntegration
            systemProperty 'create_fire_control.weaponViewServerChecks', 'true'
        }
        if (providers.gradleProperty('infraredIntegration').getOrElse('false').toBoolean()) {
            modSource project.sourceSets.infraredIntegration
        }
        if (providers.gradleProperty('missileIntegration').getOrElse('false').toBoolean()) {
            modSource project.sourceSets.missileIntegration
        }
        if (providers.gradleProperty('bombIntegration').getOrElse('false').toBoolean()) {
            modSource project.sourceSets.bombIntegration
            systemProperty 'create_fire_control.virtualBombChecks', providers.gradleProperty('virtualBombChecks').getOrElse('false')
        }
        if (providers.gradleProperty('rocketIntegration').getOrElse('false').toBoolean()) {
            modSource project.sourceSets.rocketIntegration
            systemProperty 'create_fire_control.countermeasureChecks',
                    providers.gradleProperty('countermeasureIntegration').getOrElse('false')
        }
        if (providers.gradleProperty('controllerIntegration').getOrElse('false').toBoolean()) {
            modSource project.sourceSets.controllerIntegration
            systemProperty 'create_fire_control.controllerApiOnly', providers.gradleProperty('controllerApiOnly').getOrElse('false')
        }
        if (providers.gradleProperty('dieselIntegration').getOrElse('false').toBoolean()) {
            modSource project.sourceSets.dieselIntegration
        }
        if (providers.gradleProperty('apfsdsIntegration').getOrElse('false').toBoolean()) {
            modSource project.sourceSets.apfsdsIntegration
        }
        if (providers.gradleProperty('annihilationIntegration').getOrElse('false').toBoolean()) {
            modSource project.sourceSets.annihilationIntegration
        }
        if (providers.gradleProperty('gunfireIntegration').getOrElse('false').toBoolean()) {
            modSource project.sourceSets.gunfireIntegration
        }
        if (providers.gradleProperty('recoilIntegration').getOrElse('false').toBoolean()) {
            modSource project.sourceSets.recoilIntegration
        }
        if (providers.gradleProperty('ticketIntegration').getOrElse('false').toBoolean()) {
            modSource project.sourceSets.ticketIntegration
        }
        if (providers.gradleProperty('bearingIntegration').getOrElse('false').toBoolean()) {
            modSource project.sourceSets.bearingIntegration
            systemProperty 'create_fire_control.characterizeCarrierHold',
                    providers.gradleProperty('characterizeCarrierHold').getOrElse('false')
            systemProperty 'create_fire_control.isolatedCarrierStaff',
                    providers.gradleProperty('isolatedCarrierStaff').getOrElse('false')
            systemProperty 'create_fire_control.finiteCarrierAim',
                    providers.gradleProperty('finiteCarrierAim').getOrElse('false')
            systemProperty 'create_fire_control.finiteSupportBeforeHinges',
                    providers.gradleProperty('finiteSupportBeforeHinges').getOrElse('false')
            systemProperty 'create_fire_control.finiteAimTransitions',
                    providers.gradleProperty('finiteAimTransitions').getOrElse('false')
            systemProperty 'create_fire_control.finiteLimitTransitions',
                    providers.gradleProperty('finiteLimitTransitions').getOrElse('false')
            systemProperty 'create_fire_control.aimEdgeCases',
                    providers.gradleProperty('aimEdgeCases').getOrElse('false')
            systemProperty 'create_fire_control.finiteUserOffsets',
                    providers.gradleProperty('finiteUserOffsets').getOrElse('false')
            systemProperty 'create_fire_control.finiteMediumCannon',
                    providers.gradleProperty('finiteMediumCannon').getOrElse('false')
            systemProperty 'create_fire_control.finiteGroundTarget',
                    providers.gradleProperty('finiteGroundTarget').getOrElse('false')
            systemProperty 'create_fire_control.finiteRebaseSupport',
                    providers.gradleProperty('finiteRebaseSupport').getOrElse('false')
            systemProperty 'create_fire_control.finiteTranslation',
                    providers.gradleProperty('finiteTranslation').getOrElse('false')
            systemProperty 'create_fire_control.finiteCombinedMotion',
                    providers.gradleProperty('finiteCombinedMotion').getOrElse('false')
            systemProperty 'create_fire_control.finiteProductionInput',
                    providers.gradleProperty('finiteProductionInput').getOrElse('false')
            systemProperty 'create_fire_control.finiteWeldedCarrier',
                    providers.gradleProperty('finiteWeldedCarrier').getOrElse('false')
            systemProperty 'create_fire_control.finiteWeldedTurret',
                    providers.gradleProperty('finiteWeldedTurret').getOrElse('false')
            systemProperty 'create_fire_control.legacyBearingSources',
                    providers.gradleProperty('legacyBearingSources').getOrElse('false')
        }
    }
}

// Apply after the standard runs exist; CopyPoly stays in its own MIT source tree.
apply from: 'gradle/copypoly.gradle'

if (providers.gradleProperty('controllerClientChecks').getOrElse('false').toBoolean()) {
    runs.client {
        modSource project.sourceSets.controllerIntegration
        systemProperty 'create_fire_control.controllerClientChecks', 'true'
        systemProperty 'create_fire_control.controllerKeyboardChecks',
                providers.gradleProperty('controllerKeyboardChecks').getOrElse('false')
        argument '--width'
        argument '1280'
        argument '--height'
        argument '720'
    }
}

if (providers.gradleProperty('weaponViewServerChecks').getOrElse('false').toBoolean()) {
    def viewServerResult = layout.projectDirectory.dir(providers.gradleProperty('runRoot').getOrElse('run'))
            .file('server/weapon-view-server-result.txt').asFile
    tasks.matching { it.name == 'runServer' }.configureEach {
        doFirst { viewServerResult.parentFile.mkdirs(); viewServerResult.text = 'RUNNING' }
        doLast {
            if (!viewServerResult.isFile() || viewServerResult.text.trim() != 'PASS')
                throw new GradleException('Weapon view server checks failed: ' + viewServerResult.text)
        }
    }
}

if (providers.gradleProperty('weaponViewClientChecks').getOrElse('false').toBoolean()) {
    def viewResult = layout.projectDirectory.dir(providers.gradleProperty('runRoot').getOrElse('run'))
            .file('client/weapon-view-client-result.txt').asFile
    tasks.matching { it.name == 'runClient' }.configureEach {
        doFirst { viewResult.parentFile.mkdirs(); viewResult.text = 'RUNNING' }
        doLast {
            if (!viewResult.isFile() || viewResult.text.trim() != 'PASS') {
                throw new GradleException('Weapon view client checks failed: ' +
                        (viewResult.isFile() ? viewResult.text : 'missing result'))
            }
        }
    }
}

