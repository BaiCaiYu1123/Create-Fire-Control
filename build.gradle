def cbcRuntime = providers.gradleProperty('cbcRuntime')
        .map { it.toBoolean() }
        .getOrElse(false)
def touhouMaidRuntime = providers.gradleProperty('touhouMaidRuntime')
        .map { it.toBoolean() }
        .getOrElse(false)
def mianbaoJar = providers.gradleProperty('mianbaoJar')
        .map { file(it) }
        .orNull
def touhouMaidJar = providers.gradleProperty('touhouMaidJar')
        .map { file(it) }
        .orNull
def sableJar = 'libs/compat-latest/sable-neoforge-1.21.1-2.0.6.jar'
def aeronauticsJar = 'libs/compat-latest/create-aeronautics-bundled-1.21.1-1.3.2.jar'
def simulatedJar = 'libs/compat-latest/simulated-neoforge-1.21.1-1.3.2.jar'
def sableRapierJar = 'libs/compat-latest/sable-rapier-1.21.1-2.0.6.jar'

dependencies {
    if (providers.gradleProperty('annihilationIntegration').getOrElse('false').toBoolean()
            || providers.gradleProperty('dieselIntegration').getOrElse('false').toBoolean()
            || providers.gradleProperty('rocketIntegration').getOrElse('false').toBoolean()
            || providers.gradleProperty('missileIntegration').getOrElse('false').toBoolean()
            || providers.gradleProperty('missileClientChecks').getOrElse('false').toBoolean()
            || providers.gradleProperty('dieselClientChecks').getOrElse('false').toBoolean()) {
        localRuntime files(simulatedJar, sableRapierJar)
    }
    implementation "net.neoforged:neoforge:${neo_version}"
    implementation "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"
    implementation "org.jcodec:jcodec:0.2.5"
    implementation "org.jcodec:jcodec-javase:0.2.5"
    nativeBearingImplementation 'org.lz4:lz4-java:1.8.0'
    nativeBearingRuntimeOnly files(sableRapierJar)
    embeddedLibraries "org.jcodec:jcodec:0.2.5"
    embeddedLibraries "org.jcodec:jcodec-javase:0.2.5"

    implementation files('libs/create-1.21.1-6.0.10.jar')
    implementation files(sableJar)
    implementation files(aeronauticsJar)
    compileOnly files(simulatedJar)
    compileOnly files('libs/compat-latest/drivebywire-0.3.0.jar')
    compileOnly files(sableRapierJar)
    compileOnly files('libs/sable-companion-common-1.21.1-1.6.0-compile.jar')
    testImplementation files('libs/sable-companion-common-1.21.1-1.6.0-compile.jar')
    testImplementation files('libs/ritchiesprojectilelib-2.1.2+mc.1.21.1-neoforge.jar')
    compileOnly files('libs/ponder-neoforge-1.0.82-mc1.21.1-compile.jar')
    compileOnly files('libs/registrate-MC1.21-1.3.0+67-compile.jar')
    compileOnly files('libs/flywheel-neoforge-1.21.1-1.0.6-compile.jar')
    compileOnly files('libs/interiors-1.21.1-neoforge-0.6.1.jar')
    compileOnly files('libs/sable-schematic-api-0.4.0.jar')
    compileOnly files('libs/createbigcannons-5.11.7-mc1.21.1-compile.jar')
    compileOnly files('libs/ritchiesprojectilelib-2.1.2+mc.1.21.1-neoforge.jar')
    compileOnly files('libs/cbcmodernwarfare-0.0.6v+mc.1.21.1-neoforge.jar')
    compileOnly files('libs/yuushya_modelling-1.21.1-2.4.1.jar')
    testCompileOnly files('libs/yuushya_modelling-1.21.1-2.4.1.jar')
    if (touhouMaidJar != null) {
        compileOnly files(touhouMaidJar)
    } else {
        compileOnly 'maven.modrinth:touhou-little-maid:1.5.3-neoforge+mc1.21.1'
    }
    if (mianbaoJar != null) {
        compileOnly files(mianbaoJar)
    }

    if (providers.gradleProperty('controllerBlueprintChecks').getOrElse('false').toBoolean()) {
        localRuntime files(providers.gradleProperty('controllerBlueprintJar')
                .getOrElse('libs/sable-schematic-api-0.4.0.jar'))
        if (providers.gradleProperty('blueprintLibraryJar').isPresent()) localRuntime files(file(providers.gradleProperty('blueprintLibraryJar').get()))
    }
    localRuntime files('libs/create-1.21.1-6.0.10.jar')
    localRuntime files(sableJar)
    localRuntime files(aeronauticsJar)
    if (providers.gradleProperty('wirelessControllerWireRuntime').getOrElse('false').toBoolean()) {
        localRuntime files('libs/compat-latest/drivebywire-0.3.0.jar')
    }
    if (providers.gradleProperty('controllerModelJar').isPresent()) {
        localRuntime files(file(providers.gradleProperty('controllerModelJar').get()))
    }
    if (providers.gradleProperty('lightspeedJar').isPresent()) {
        localRuntime files(file(providers.gradleProperty('lightspeedJar').get()))
    }
    if (providers.gradleProperty('flightControlJar').isPresent()) {
        localRuntime files(file(providers.gradleProperty('flightControlJar').get()))
    }
    localRuntime files('libs/interiors-1.21.1-neoforge-0.6.1.jar')
    if (cbcRuntime) {
        localRuntime files('libs/createbigcannons-5.11.7-mc1.21.1-compile.jar')
        localRuntime files('libs/cbcmodernwarfare-0.0.6v+mc.1.21.1-neoforge.jar')
        localRuntime files('libs/ritchiesprojectilelib-2.1.2+mc.1.21.1-neoforge.jar')
        localRuntime files('libs/yuushya_modelling-1.21.1-2.4.1.jar')
    }
    if (touhouMaidRuntime) {
        if (touhouMaidJar != null) {
            localRuntime files(touhouMaidJar)
        } else {
            localRuntime 'maven.modrinth:touhou-little-maid:1.5.3-neoforge+mc1.21.1'
        }
    }
