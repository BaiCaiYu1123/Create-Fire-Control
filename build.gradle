configurations {
    runtimeClasspath.extendsFrom localRuntime
    embeddedLibraries
}

tasks.register('testWirelessControllerInputs', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.hooya.stabilizedturret.content.remote.ControllerInputRoutingChecks'
}
tasks.named('check').configure { dependsOn 'testWirelessControllerInputs' }

tasks.register('testRemoteInputRoute', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.hooya.stabilizedturret.content.controller.RemoteInputRouteChecks'
}
tasks.named('check').configure { dependsOn 'testRemoteInputRoute' }

tasks.register('testMianbaoBombBallistics', JavaExec) {
    dependsOn tasks.named('testClasses')
