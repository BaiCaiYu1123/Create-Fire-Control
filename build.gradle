// 额外改动（2026-11-06）：虚拟炸弹快照不能打断帧间插值。
tasks.register('bombRenderInterpolationChecks', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.hooya.stabilizedturret.client.BombRenderInterpolationChecks'
