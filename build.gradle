// JCodec is pure Java and is shaded into the mod so video playback does not
// require FFmpeg, VLC, or another native program on the player's computer.
// Relocate it because other mods (notably Citadel) may also shade JCodec; two
// automatic modules exporting org.jcodec.* cannot coexist in ModLaunch's layer.
tasks.named('jar').configure {
    archiveClassifier = 'slim'
}

tasks.named('shadowJar').configure {
    archiveClassifier = ''
    configurations = [project.configurations.embeddedLibraries]
    exclude 'org/jcodec/testing/**'
    relocate 'org.jcodec', "${mod_group_id}.internal.jcodec"
    relocate 'net.sourceforge.jaad', "${mod_group_id}.internal.jaad"
    exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA'
}

def verifyShadedJar = tasks.register('verifyShadedJar') {
    dependsOn tasks.named('shadowJar')
    def shadedArchive = tasks.named('shadowJar').flatMap { it.archiveFile }
    def relocatedJcodecPrefix = mod_group_id.replace('.', '/') + '/internal/jcodec/'
    inputs.file(shadedArchive)

    doLast {
        def archive = inputs.files.singleFile
        def zip = new java.util.zip.ZipFile(archive)
        try {
            def entries = zip.entries().collect { it.name }
            def leakedPackage = entries.find {
                it.startsWith('org/jcodec/') || it.startsWith('net/sourceforge/jaad/')
            }
            if (leakedPackage != null) {
                throw new GradleException("Unrelocated JCodec class ${leakedPackage} found in " +
                        "${archive.name}; this causes a Java module split-package crash with Citadel.")
            }

            if (!entries.any { it.startsWith(relocatedJcodecPrefix) }) {
                throw new GradleException("Relocated JCodec classes are missing from ${archive.name}.")
            }
        } finally {
            zip.close()
        }
    }
}

tasks.named('assemble').configure {
    dependsOn verifyShadedJar
}

