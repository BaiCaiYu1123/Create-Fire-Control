['dieselIntegration': ['runServer', 'server/diesel-integration-result.txt'],
 'dieselClientChecks': ['runClient', 'client/diesel-client-result.txt'],
 'engineBehaviorClientChecks': ['runClient', 'client/engine-behavior-client-result.txt']].each { propertyName, fixture ->
    if (providers.gradleProperty(propertyName).getOrElse('false').toBoolean()) {
        def result = layout.projectDirectory.dir(providers.gradleProperty('runRoot').getOrElse('run'))
                .file(fixture[1]).asFile
        tasks.matching { it.name == fixture[0] }.configureEach {
            doFirst { result.parentFile.mkdirs(); result.text = 'RUNNING' }
            doLast {
                if (!result.isFile() || result.text.trim() != 'PASS')
                    throw new GradleException('99A integration failed: ' + (result.isFile() ? result.text : 'missing result'))
            }
        }
    }
}

