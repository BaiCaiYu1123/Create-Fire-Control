plugins {
    id 'java-library'
    id 'net.neoforged.gradle.userdev' version '7.1.38'
    id 'com.gradleup.shadow' version '9.2.2'
}

tasks.register('testInactiveSessionSync', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.hooya.stabilizedturret.network.InactiveSessionSyncChecks'
}

tasks.register('testStructurePreview', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.hooya.stabilizedturret.client.StructurePreviewChecks'
}
tasks.named('check') { dependsOn tasks.named('testStructurePreview') }
tasks.named('check') { dependsOn tasks.named('testInactiveSessionSync') }

tasks.register('testCannonReflection', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.hooya.stabilizedturret.content.controller.CannonReflectionChecks'
}
tasks.named('check') { dependsOn tasks.named('testCannonReflection') }

tasks.register('testVirtualScopeGeometry', JavaExec) {
    dependsOn tasks.named('testClasses')
