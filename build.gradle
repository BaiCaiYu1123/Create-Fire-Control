    mainClass = 'com.hooya.stabilizedturret.content.controller.VirtualScopeGeometryChecks'
}
tasks.named('check') { dependsOn tasks.named('testVirtualScopeGeometry') }

tasks.register('testScopeOrientation', JavaExec) {
    dependsOn tasks.named('testClasses')
