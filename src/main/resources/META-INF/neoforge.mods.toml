modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Hooya"
description='''
Adds a Sable-based tank fire-control computer with dual-axis stabilization,
head aiming, cannon optics and thermal imaging.
'''

[[mixins]]
config="stabilized_turret.mixins.json"

