modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="BaiCaiYu"
description='''
Adds a Sable-based vehicle fire-control system with dual-axis stabilization,
head aiming, cannon optics, thermal imaging, radar, guided missiles and
remote weapon control.
'''

[[mixins]]
config="create_fire_control.mixins.json"

# MIT component kept in third_party/copypoly; this does not relicense Fire Control.
[[mods]]
modId="copypoly"
version="1.9.1"
displayName="CopyPoly (bundled with Fire Control)"
authors="caca"
license="MIT"
description='''
CopyPoly 1.9.1 by caca, bundled under the MIT License.
Full in-world polyhedron editor, material copying, topology and Sable physics.
Only com.caca.copypoly and the identified CopyPoly resources are MIT licensed.
See META-INF/licenses/copypoly-MIT.txt and META-INF/notices/copypoly.txt.
'''

[[mixins]]
config="copypoly.mixins.json"

