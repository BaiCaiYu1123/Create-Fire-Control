gradle.projectsEvaluated {
    def project = rootProject
    def fixture = project.sourceSets.create('aaExplosionIntegration') {
        java.srcDirs = ['src/aaExplosionIntegration/java']
        compileClasspath += project.sourceSets.main.output + project.sourceSets.main.compileClasspath
        runtimeClasspath += project.sourceSets.main.output + project.sourceSets.main.runtimeClasspath
    }
    def referenceLibs = project.file(project.providers.gradleProperty('referenceLibs').getOrElse('libs'))
    project.dependencies.add('localRuntime', project.files(
            new File(referenceLibs, 'compat-latest/simulated-neoforge-1.21.1-1.3.2.jar'),
            new File(referenceLibs, 'compat-latest/sable-rapier-1.21.1-2.0.6.jar')))
    project.runs.server {
        modSource fixture
        systemProperty 'create_fire_control.modePolicyChecks',
                project.providers.gradleProperty('modePolicyChecks').getOrElse('false')
        systemProperty 'create_fire_control.modePolicyReload',
                project.providers.gradleProperty('modePolicyReload').getOrElse('false')
    }
    def result = project.layout.projectDirectory.dir(project.providers.gradleProperty('runRoot').get())
            .file('server/aa-explosion-result.txt').asFile
    project.tasks.named('runServer').configure {
        doFirst { result.parentFile.mkdirs(); result.text = 'RUNNING' }
        doLast {
            if (!result.isFile() || !result.text.startsWith('PASS')) {
                throw new GradleException('AA explosion integration failed: ' +
                        (result.isFile() ? result.text : 'missing result'))
            }
        }
    }
}
