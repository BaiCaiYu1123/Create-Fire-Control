gradle.projectsEvaluated {
    def project = rootProject
    def fixture = project.sourceSets.create('antiRadiationIntegration') {
        java.srcDirs = ['src/antiRadiationIntegration/java']
        compileClasspath += project.sourceSets.main.output + project.sourceSets.main.compileClasspath
        runtimeClasspath += project.sourceSets.main.output + project.sourceSets.main.runtimeClasspath
    }
    project.dependencies.add('localRuntime', project.files(
            'libs/compat-latest/simulated-neoforge-1.21.1-1.3.2.jar',
            'libs/compat-latest/sable-rapier-1.21.1-2.0.6.jar'))
    project.runs.server { modSource fixture }
    def clientChecks = project.providers.gradleProperty('antiRadiationClientChecks').getOrElse('false').toBoolean()
    def exhaustChecks = project.providers.gradleProperty('antiRadiationExhaustChecks').getOrElse('false').toBoolean()
    if (clientChecks || exhaustChecks) {
        project.runs.client {
            modSource fixture
            systemProperty 'create_fire_control.antiRadiationClientChecks', clientChecks.toString()
            systemProperty 'create_fire_control.antiRadiationExhaustChecks', exhaustChecks.toString()
            argument '--width'; argument '2560'
            argument '--height'; argument '1440'
        }
        if (project.providers.gradleProperty('flightControlJar').isPresent())
            project.dependencies.add('localRuntime', project.files(project.providers.gradleProperty('flightControlJar').get()))
        def clientDir = project.layout.projectDirectory.dir(project.providers.gradleProperty('runRoot').get()).dir('client').asFile
        def resultName = exhaustChecks ? 'anti-radiation-exhaust-result.txt' : 'anti-radiation-client-result.txt'
        project.tasks.named('runClient').configure {
            doFirst { clientDir.mkdirs(); new File(clientDir, resultName).text = 'RUNNING' }
            doLast {
                def result = new File(clientDir, resultName)
                if (!result.isFile() || !result.text.startsWith('PASS'))
                    throw new GradleException('Anti-radiation client check failed: ' + (result.isFile() ? result.text : 'missing result'))
            }
        }
    }
    def runDir = project.layout.projectDirectory.dir(project.providers.gradleProperty('runRoot').get()).dir('server').asFile
    project.tasks.named('runServer').configure {
        doFirst { runDir.mkdirs(); new File(runDir, 'anti-radiation-result.txt').text = 'RUNNING' }
        doLast {
            def result = new File(runDir, 'anti-radiation-result.txt')
            if (!result.isFile() || !result.text.startsWith('PASS'))
                throw new GradleException('Anti-radiation integration failed: ' + (result.isFile() ? result.text : 'missing result'))
        }
    }
}
