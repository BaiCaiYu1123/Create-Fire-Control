// Opt-in checks only; normal builds and existing run configurations are unchanged.
gradle.projectsEvaluated {
    def p=rootProject
    def classic=p.providers.gradleProperty('classicArmorSelectionSmoke').getOrElse('false').toBoolean()
    p.runs.client {
        systemProperty 'create_fire_control.armorSelectionSmoke', (!classic).toString()
        systemProperty 'create_fire_control.classicArmorSelectionSmoke', classic.toString()
    }
    def runDir=p.layout.projectDirectory.dir(p.providers.gradleProperty('runRoot').getOrElse('run/armor-editor-selection')).dir('client').asFile
    p.tasks.named('runClient').configure {
        doFirst {
            runDir.mkdirs()
            def options=new File(runDir,'options.txt')
            if(!options.exists())options.text='lang:zh_cn\nguiScale:2\nrenderDistance:4\nsimulationDistance:5\nmaxFps:90\n'
        }
        doLast {
            def log=new File(runDir,'logs/latest.log')
            if(!log.isFile() || !log.getText('UTF-8').contains(classic?'CLASSIC_ARMOR_SELECTION_PASS:':'ARMOR_SELECTION_PASS:'))throw new GradleException('Armor selection checks failed: '+log)
        }
    }
}
