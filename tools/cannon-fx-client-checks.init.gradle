gradle.projectsEvaluated {
    def p=rootProject
    def fixture=p.sourceSets.create('cannonFxClientIntegration') {
        java.srcDirs=['src/cannonFxClientIntegration/java']
        compileClasspath+=p.sourceSets.main.output+p.sourceSets.main.compileClasspath
        runtimeClasspath+=p.sourceSets.main.output+p.sourceSets.main.runtimeClasspath
    }
    p.dependencies.add('localRuntime',p.files('libs/compat-latest/simulated-neoforge-1.21.1-1.3.2.jar','libs/compat-latest/sable-rapier-1.21.1-2.0.6.jar',p.providers.gradleProperty('fpsOptimizerJar').get()))
    p.runs.client {
        modSource fixture
        argument '--width';argument '960';argument '--height';argument '540'
        systemProperty 'create_fire_control.cannonFxBaseline',p.providers.gradleProperty('cannonFxBaseline').getOrElse('false')
    }
    def runDir=p.file(p.providers.gradleProperty('runRoot').get()+'/client')
    if(p.providers.gradleProperty('fxSnapshotJar').isPresent()) {
        def snapshot=new File(runDir,'mod-snapshot')
        p.copy {from p.zipTree(p.file(p.providers.gradleProperty('fxSnapshotJar').get()));into snapshot}
        p.sourceSets.main.output.classesDirs.setFrom(snapshot)
        p.sourceSets.main.output.resourcesDir=new File(runDir,'empty-resources')
    }
    p.tasks.named('runClient').configure {
        doFirst {
            runDir.mkdirs();new File(runDir,'cannon-fx-client-result.txt').text='RUNNING'
            def options=new File(runDir,'options.txt')
            if(!options.exists())options.text='lang:zh_cn\nguiScale:2\nrenderDistance:3\nsimulationDistance:3\nmaxFps:60\npauseOnLostFocus:false\nparticles:0\n'
        }
        doLast {def r=new File(runDir,'cannon-fx-client-result.txt');if(!r.exists()||!r.text.startsWith('PASS:'))throw new GradleException(r.exists()?r.text:'missing client cannon FX result')}
    }
}
