// Exercise the complete live cannon/lock path in a disposable server world.
gradle.projectsEvaluated {
    def project = rootProject
    def fixture = project.sourceSets.create('cannonLeadIntegration') {
        java.srcDirs = ['src/cannonLeadIntegration/java']
        compileClasspath += project.sourceSets.main.output + project.sourceSets.main.compileClasspath
        runtimeClasspath += project.sourceSets.main.output + project.sourceSets.main.runtimeClasspath
    }
    project.dependencies.add('localRuntime', project.files(
            'libs/compat-latest/simulated-neoforge-1.21.1-1.3.2.jar',
            'libs/compat-latest/sable-rapier-1.21.1-2.0.6.jar'))
    project.runs.server { modSource fixture }
    if (project.providers.gradleProperty('cannonAddonMods').isPresent()) {
        def addonDir = project.file(project.providers.gradleProperty('cannonAddonMods').get())
        project.dependencies.add('localRuntime', project.fileTree(addonDir) {
            include '*CBC-Military-Supplement*.jar', '*cbc_at_Neoforge*.jar',
                    'shaolib-*.jar', 'shaolib_munitions-*.jar',
                    '*Autogun-Revolution*.jar', '*CBCmoreshells*.jar'
        })
        project.runs.server { systemProperty 'create_fire_control.cannonAddonChecks', 'true' }
    }
    def runDir = project.layout.projectDirectory
            .dir(project.providers.gradleProperty('runRoot').get()).dir('server').asFile
    project.tasks.named('runServer').configure {
        doFirst {
            runDir.mkdirs()
            new File(runDir, 'cannon-lead-integration-result.txt').text = 'RUNNING'
        }
        doLast {
            def result = new File(runDir, 'cannon-lead-integration-result.txt')
            if (!result.isFile() || !result.text.startsWith('PASS:')) {
                throw new GradleException('Cannon lead integration failed: ' +
                        (result.isFile() ? result.text : 'missing result'))
            }
        }
    }
}
