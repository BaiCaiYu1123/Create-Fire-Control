gradle.projectsEvaluated {
    def p = rootProject
    def fixture = p.sourceSets.create('configIntegration') {
        java.srcDirs = ['src/configIntegration/java']
        compileClasspath += p.sourceSets.main.output + p.sourceSets.main.compileClasspath
        runtimeClasspath += p.sourceSets.main.output + p.sourceSets.main.runtimeClasspath
    }
    p.dependencies.add('localRuntime', p.files('libs/compat-latest/simulated-neoforge-1.21.1-1.3.2.jar',
            'libs/compat-latest/sable-rapier-1.21.1-2.0.6.jar'))
    p.runs.client {
        modSource fixture
        systemProperty 'create_fire_control.configClientChecks', 'true'
        argument '--width'; argument '1440'
        argument '--height'; argument '960'
    }
    def runDir = p.layout.projectDirectory.dir(p.providers.gradleProperty('runRoot')
            .getOrElse('analysis/config-menu-20261114')).dir('client').asFile
    p.tasks.named('runClient').configure {
        doFirst {
            runDir.mkdirs()
            new File(runDir, 'config-ui-client-result.txt').text = 'RUNNING'
            def options = new File(runDir, 'options.txt')
            if (!options.exists()) options.text = 'lang:zh_cn\nguiScale:2\nrenderDistance:3\nsimulationDistance:5\nmaxFps:60\n'
        }
        doLast {
            def result = new File(runDir, 'config-ui-client-result.txt')
            if (!result.isFile() || !result.text.startsWith('PASS'))
                throw new GradleException('Configuration UI checks failed: ' + (result.isFile() ? result.text : 'missing result'))
        }
    }
}
