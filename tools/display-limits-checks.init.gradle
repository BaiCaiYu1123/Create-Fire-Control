gradle.projectsEvaluated {
    def p = rootProject
    def fixture = p.sourceSets.create('displayLimitsIntegration') {
        java.srcDirs = ['src/displayLimitsIntegration/java']
        compileClasspath += p.sourceSets.main.output + p.sourceSets.main.compileClasspath
        runtimeClasspath += p.sourceSets.main.output + p.sourceSets.main.runtimeClasspath
    }
    p.dependencies.add('localRuntime', p.files('libs/compat-latest/simulated-neoforge-1.21.1-1.3.2.jar',
            'libs/compat-latest/sable-rapier-1.21.1-2.0.6.jar'))
    p.runs.server { modSource fixture }
    def runDir = p.layout.projectDirectory.dir(p.providers.gradleProperty('runRoot').get()).dir('server').asFile
    p.tasks.named('runServer').configure {
        doFirst { runDir.mkdirs(); new File(runDir, 'display-limits-result.txt').text = 'RUNNING' }
        doLast {
            def result = new File(runDir, 'display-limits-result.txt')
            if (!result.isFile() || !result.text.startsWith('PASS:'))
                throw new GradleException('Display physical limits failed: ' + (result.isFile() ? result.text : 'missing result'))
        }
    }
}
