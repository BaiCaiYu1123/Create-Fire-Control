// Real camera -> real network handler -> controller -> multiple native turret joints.
gradle.projectsEvaluated {
    def p=rootProject
    def fixture=p.sourceSets.create('headAimLiveIntegration') {
        java.srcDirs=['src/headAimLiveIntegration/java']
        compileClasspath+=p.sourceSets.main.output+p.sourceSets.main.compileClasspath
        runtimeClasspath+=p.sourceSets.main.output+p.sourceSets.main.runtimeClasspath
    }
    p.dependencies.add('localRuntime',p.files('libs/compat-latest/simulated-neoforge-1.21.1-1.3.2.jar','libs/compat-latest/sable-rapier-1.21.1-2.0.6.jar'))
    p.runs.client {
        modSource fixture
        argument '--width';argument '960'
        argument '--height';argument '540'
        systemProperty 'create_fire_control.headAimLiveBaseline',p.providers.gradleProperty('headAimLiveBaseline').getOrElse('false')
    }
    def runDir=p.file(p.providers.gradleProperty('runRoot').get()+'/client')
    if(p.providers.gradleProperty('aimSnapshotJar').isPresent()) {
        def snapshot=new File(runDir,'mod-snapshot')
        p.copy { from p.zipTree(p.file(p.providers.gradleProperty('aimSnapshotJar').get()));into snapshot }
        p.sourceSets.main.output.classesDirs.setFrom(snapshot)
        p.sourceSets.main.output.resourcesDir=new File(runDir,'empty-resources')
    }
    p.tasks.named('runClient').configure {
        doFirst {
            runDir.mkdirs()
            new File(runDir,'head-aim-live-result.txt').text='RUNNING'
            def options=new File(runDir,'options.txt')
            if(!options.exists())options.text='lang:zh_cn\nguiScale:2\nrenderDistance:3\nsimulationDistance:3\nmaxFps:60\npauseOnLostFocus:false\n'
        }
        doLast {
            def result=new File(runDir,'head-aim-live-result.txt')
            if(!result.exists()||!result.text.startsWith('PASS:'))throw new GradleException('Live head aim failed: '+(result.exists()?result.text:'missing result'))
        }
    }
}
