// Run with -PrunRoot=<isolated directory> and optionally -PletItWalkJar=<jar>.
gradle.projectsEvaluated {
    def project = rootProject
    def fixture = project.sourceSets.create('mergingGlueIntegration') {
        java.srcDirs = ['src/mergingGlueIntegration/java']
        compileClasspath += project.sourceSets.main.output + project.sourceSets.main.compileClasspath
        runtimeClasspath += project.sourceSets.main.output + project.sourceSets.main.runtimeClasspath
    }
    project.dependencies.add('localRuntime', project.files(
            'libs/compat-latest/simulated-neoforge-1.21.1-1.3.2.jar',
            'libs/compat-latest/sable-rapier-1.21.1-2.0.6.jar'))
    if (project.providers.gradleProperty('letItWalkJar').isPresent()) {
        project.dependencies.add('localRuntime', project.files(
                project.providers.gradleProperty('letItWalkJar').get()))
    }
    project.runs.server {
        modSource fixture
        systemProperty 'mixin.debug.export', 'true'
        systemProperty 'mixin.debug.export.filter',
                'dev.simulated_team.simulated.content.blocks.merging_glue.MergingGlueBlockEntity'
    }
    def result = project.layout.projectDirectory
            .dir(project.providers.gradleProperty('runRoot').get())
            .file('server/merging-glue-result.txt').asFile
    project.tasks.named('runServer').configure {
        doFirst {
            result.parentFile.mkdirs()
            result.text = 'RUNNING'
        }
        doLast {
            if (!result.isFile() || !result.text.startsWith('PASS:')) {
                throw new GradleException('Merging glue checks failed: ' +
                        (result.isFile() ? result.text : 'missing result'))
            }
        }
    }
}
