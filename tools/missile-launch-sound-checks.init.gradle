gradle.projectsEvaluated {
    def project = rootProject
    def fixture = project.sourceSets.create('missileSoundIntegration') {
        java.srcDirs = ['src/missileSoundIntegration/java']
        compileClasspath += project.sourceSets.main.output + project.sourceSets.main.compileClasspath
        runtimeClasspath += project.sourceSets.main.output + project.sourceSets.main.runtimeClasspath
    }
    project.dependencies.add('localRuntime', project.files(
            'libs/compat-latest/simulated-neoforge-1.21.1-1.3.2.jar',
            'libs/compat-latest/sable-rapier-1.21.1-2.0.6.jar'))
    project.runs.server { modSource fixture }
    def result = project.layout.projectDirectory.dir(project.providers.gradleProperty('runRoot').get())
            .file('server/missile-launch-sound-result.txt').asFile
    project.tasks.named('runServer').configure {
        doFirst { result.parentFile.mkdirs(); result.text = 'RUNNING' }
        doLast {
            if (!result.isFile() || result.text.trim() != 'PASS')
                throw new GradleException('Missile launch sound checks failed: ' + (result.isFile() ? result.text : 'missing result'))
        }
    }
}
