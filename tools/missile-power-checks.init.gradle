gradle.beforeProject { project ->
    project.layout.buildDirectory.set(project.layout.projectDirectory.dir('build-missile-power-verify'))
}
gradle.projectsEvaluated {
    def project = rootProject
    def fixture = project.sourceSets.create('missilePowerIntegration') {
        java.srcDirs = ['src/missilePowerIntegration/java']
        compileClasspath += project.sourceSets.main.output + project.sourceSets.main.compileClasspath
        runtimeClasspath += project.sourceSets.main.output + project.sourceSets.main.runtimeClasspath
    }
    project.dependencies.add('localRuntime', project.files(
            'libs/compat-latest/simulated-neoforge-1.21.1-1.3.2.jar',
            'libs/compat-latest/sable-rapier-1.21.1-2.0.6.jar'))
    project.runs.server { modSource fixture }
    project.runs.client {
        modSource fixture
        systemProperty 'create_fire_control.missilePowerClientChecks', 'true'
        argument '--width'; argument '960'
        argument '--height'; argument '540'
    }
    def result = project.layout.projectDirectory.dir(project.providers.gradleProperty('runRoot')
            .getOrElse('run_missile_power_verify')).file('server/missile-power-result.txt').asFile
    project.tasks.named('runServer').configure {
        doFirst { result.parentFile.mkdirs(); result.text = 'RUNNING' }
        doLast {
            if (!result.isFile() || !result.text.startsWith('PASS'))
                throw new GradleException('Missile power integration failed: ' +
                        (result.isFile() ? result.text : 'missing result'))
        }
    }
    def clientResult = new File(result.parentFile.parentFile, 'client/missile-power-client-result.txt')
    project.tasks.named('runClient').configure {
        doFirst { clientResult.parentFile.mkdirs(); clientResult.text = 'RUNNING' }
        doLast {
            if (!clientResult.isFile() || !clientResult.text.startsWith('PASS'))
                throw new GradleException('Missile power client loading failed: ' +
                        (clientResult.isFile() ? clientResult.text : 'missing result'))
        }
    }
}
