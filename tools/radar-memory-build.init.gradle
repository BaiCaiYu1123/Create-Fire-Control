gradle.beforeProject { project ->
    project.layout.buildDirectory.set(project.layout.projectDirectory.dir('build-radar-memory-verify'))
}
gradle.projectsEvaluated {
    def p = rootProject
    p.tasks.register('testRadarContactMemory', JavaExec) {
        dependsOn p.tasks.named('testClasses')
        classpath = p.sourceSets.test.runtimeClasspath
        mainClass = 'com.hooya.stabilizedturret.content.controller.RadarContactMemoryChecks'
    }
    if (p.providers.gradleProperty('radarMemoryArtifact').isPresent()) {
        p.tasks.register('testRadarMemoryArtifact', JavaExec) {
            dependsOn p.tasks.named('testClasses')
            classpath = p.sourceSets.test.output + p.files(p.providers.gradleProperty('radarMemoryArtifact').get()) +
                    (p.sourceSets.test.runtimeClasspath - p.sourceSets.main.output - p.sourceSets.test.output) +
                    p.configurations.localRuntime + p.sourceSets.main.compileClasspath
            mainClass = 'com.hooya.stabilizedturret.content.controller.RadarMemoryArtifactChecks'
        }
    }
    p.tasks.register('patchRadarMemory', JavaExec) {
        dependsOn p.tasks.named('testClasses'), p.tasks.named('shadowJar')
        classpath = p.sourceSets.test.runtimeClasspath
        mainClass = 'com.hooya.stabilizedturret.content.controller.RadarMemoryMethodPatch'
        args p.providers.gradleProperty('radarMemoryBaseline').get(),
                p.tasks.named('shadowJar').get().archiveFile.get().asFile.absolutePath,
                p.file('analysis/radar-memory-20261114/method-patches').absolutePath
    }
}
