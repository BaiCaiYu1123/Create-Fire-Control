// Reproduce the display's SectionPos overflow in a disposable Sable world.
gradle.projectsEvaluated {
    def project = rootProject
    def fixture = project.sourceSets.create('radarScanIntegration') {
        java.srcDirs = ['src/radarScanIntegration/java']
        compileClasspath += project.sourceSets.main.output + project.sourceSets.main.compileClasspath
        runtimeClasspath += project.sourceSets.main.output + project.sourceSets.main.runtimeClasspath
    }
    project.dependencies.add('localRuntime', project.files(
            'libs/compat-latest/simulated-neoforge-1.21.1-1.3.2.jar',
            'libs/compat-latest/sable-rapier-1.21.1-2.0.6.jar'))
    if (project.providers.gradleProperty('radarLithiumJar').isPresent()) {
        project.dependencies.add('localRuntime', project.files(
                project.providers.gradleProperty('radarLithiumJar').get()))
    }
    project.runs.server {
        modSource fixture
        systemProperty 'create_fire_control.radarOcclusionChecks',
                project.providers.gradleProperty('radarOcclusionChecks').getOrElse('false')
    }
    def runDir = project.layout.projectDirectory
            .dir(project.providers.gradleProperty('runRoot').get()).dir('server').asFile
    project.tasks.named('runServer').configure {
        doFirst {
            runDir.mkdirs()
            new File(runDir, 'radar-scan-result.txt').text = 'RUNNING'
        }
        doLast {
            def result = new File(runDir, 'radar-scan-result.txt')
            if (!result.isFile() || !result.text.startsWith('PASS:')) {
                throw new GradleException('Display radar scan failed: ' +
                        (result.isFile() ? result.text : 'missing result'))
            }
        }
    }
}
