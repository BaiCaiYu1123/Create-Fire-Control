// Opt-in real server checks, isolated from the release source set and game saves.
gradle.projectsEvaluated {
    def project = rootProject
    def fixture = project.sourceSets.create('scopeIntegration') {
        java.srcDirs = ['src/scopeIntegration/java', 'src/dieselIntegration/java']
        java.include 'com/hooya/stabilizedturret/content/controller/ScopeIntegration.java',
                'edn/stratodonut/drivebywire/compat/ControllerSignalStore.java'
        compileClasspath += project.sourceSets.main.output + project.sourceSets.main.compileClasspath
        runtimeClasspath += project.sourceSets.main.output + project.sourceSets.main.runtimeClasspath
    }
    project.dependencies.add('localRuntime', project.files(
            'libs/compat-latest/simulated-neoforge-1.21.1-1.3.2.jar',
            'libs/compat-latest/sable-rapier-1.21.1-2.0.6.jar'))
    project.runs.configureEach { modSource fixture }
    def runDir = project.layout.projectDirectory
            .dir(project.providers.gradleProperty('runRoot').get()).dir('server').asFile
    project.tasks.named('runServer').configure {
        doFirst {
            runDir.mkdirs()
            new File(runDir, 'scope-integration-result.txt').text = 'RUNNING'
        }
        doLast {
            def result = new File(runDir, 'scope-integration-result.txt')
            if (!result.isFile() || result.text.trim() != 'PASS') {
                throw new GradleException('Scope integration failed: ' +
                        (result.isFile() ? result.text : 'missing result'))
            }
        }
    }
}
