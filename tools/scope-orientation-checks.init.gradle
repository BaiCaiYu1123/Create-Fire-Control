// Isolated real-client HUD and Sable heading checks; no fixture enters the release JAR.
gradle.projectsEvaluated {
    def project = rootProject
    def fixture = project.sourceSets.create('scopeOrientationIntegration') {
        java.srcDirs = ['src/scopeOrientationIntegration/java']
        compileClasspath += project.sourceSets.main.output + project.sourceSets.main.compileClasspath
        runtimeClasspath += project.sourceSets.main.output + project.sourceSets.main.runtimeClasspath
    }
    project.dependencies.add('localRuntime', project.files(
            'libs/compat-latest/simulated-neoforge-1.21.1-1.3.2.jar',
            'libs/compat-latest/sable-rapier-1.21.1-2.0.6.jar'))
    project.runs.client {
        modSource fixture
        systemProperty 'create_fire_control.scopeOrientationChecks', 'true'
        systemProperty 'create_fire_control.scopeAmmoChecks',
                project.providers.gradleProperty('scopeAmmoChecks').getOrElse('false')
        argument '--width'
        argument '1280'
        argument '--height'
        argument '720'
    }
    def runDir = project.file(project.providers.gradleProperty('runRoot').get() + '/client')
    project.tasks.named('runClient').configure {
        doFirst {
            runDir.mkdirs()
            new File(runDir, 'scope-orientation-client-result.txt').text = 'RUNNING'
        }
        doLast {
            def result = new File(runDir, 'scope-orientation-client-result.txt')
            if (!result.isFile() || result.text.trim() != 'PASS') {
                throw new GradleException('Scope orientation client failed: ' +
                        (result.isFile() ? result.text : 'missing result'))
            }
        }
    }
}
