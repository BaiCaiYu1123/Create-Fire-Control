// Opt-in game checks, excluded from the release JAR and isolated from player saves.
gradle.projectsEvaluated {
    def project = rootProject
    def fixture = project.sourceSets.create('virtualScopeIntegration') {
        java.srcDirs = ['src/virtualScopeIntegration/java']
        compileClasspath += project.sourceSets.main.output + project.sourceSets.main.compileClasspath
        runtimeClasspath += project.sourceSets.main.output + project.sourceSets.main.runtimeClasspath
    }
    project.dependencies.add('localRuntime', project.files(
            'libs/compat-latest/simulated-neoforge-1.21.1-1.3.2.jar',
            'libs/compat-latest/sable-rapier-1.21.1-2.0.6.jar'))
    if (project.providers.gradleProperty('scopeIrisJar').isPresent()) {
        project.dependencies.add('localRuntime', project.files(
                project.providers.gradleProperty('scopeIrisJar').get(),
                project.providers.gradleProperty('scopeSodiumJar').get()))
    }
    if (project.providers.gradleProperty('scopeVoxyJar').isPresent()) {
        project.dependencies.add('localRuntime', project.files(project.providers.gradleProperty('scopeVoxyJar').get()))
    }
    if (project.providers.gradleProperty('scopeColorwheelJar').isPresent()) {
        project.dependencies.add('localRuntime', project.files(project.providers.gradleProperty('scopeColorwheelJar').get()))
    }
    project.runs.configureEach { modSource fixture }
    project.runs.client {
        systemProperty 'create_fire_control.virtualScopeClientChecks',
                project.providers.gradleProperty('scopeShaderChecks').getOrElse('false') == 'true' ? 'false' : 'true'
        systemProperty 'create_fire_control.virtualScopeShaderChecks',
                project.providers.gradleProperty('scopeShaderChecks').getOrElse('false')
        systemProperty 'create_fire_control.scopeColorwheelChecks',
                project.providers.gradleProperty('scopeColorwheelJar').isPresent() ? 'true' : 'false'
        argument '--width'
        argument '1280'
        argument '--height'
        argument '720'
    }
    def runDir = project.file(project.providers.gradleProperty('runRoot').get())
    project.tasks.named('runServer').configure {
        doFirst {
            new File(runDir, 'server/virtual-scope-integration-result.txt').text = 'RUNNING'
            // Each fixture assembles new physical bodies; never reuse a previous fixture's graph.
            def properties = new File(runDir, 'server/server.properties')
            properties.append('\nlevel-name=virtual-scope-' + System.currentTimeMillis() + '\n')
        }
        doLast {
            def result = new File(runDir, 'server/virtual-scope-integration-result.txt')
            if (!result.isFile() || result.text.trim() != 'PASS') throw new GradleException('Virtual scope integration failed: ' + (result.isFile() ? result.text : 'missing result'))
        }
    }
    project.tasks.named('runClient').configure {
        doFirst { new File(runDir, 'client/virtual-scope-client-result.txt').text = 'RUNNING' }
        doLast {
            def result = new File(runDir, 'client/virtual-scope-client-result.txt')
            if (!result.isFile() || result.text.trim() != 'PASS') throw new GradleException('Virtual scope client failed: ' + (result.isFile() ? result.text : 'missing result'))
        }
    }
}
